
name: Portfolio CI/CD Deployment

on:
  push:
    branches:
      - main
    paths:
      - '**/*.html'
      - '**/*.css'
      - '**/*.js'
      - '**/*.json'
      - '**/*.ico'
      - '**/*.png'
      - '**/*.jpg'
      - '**/*.jpeg'
      - '**/*.gif'
      - '**/*.svg'
      - '**/*.webp'
      - '**/*.woff'
      - '**/*.woff2'
      - '**/*.ttf'
      - '**/*.xml'
      - '**/robots.txt'
      - '.github/workflows/deploy.yml'
  workflow_dispatch:

permissions:
  id-token: write
  contents: read

jobs:
  deploy-website:
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v6.3.0
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }}

      - name: Verify AWS identity
        run: aws sts get-caller-identity

      - name: Prepare website files
        run: |
          mkdir -p deploy

          git ls-files -z | while IFS= read -r -d '' file; do
            case "$file" in
              *.html|*.css|*.js|*.json|*.ico|*.png|*.jpg|*.jpeg|*.gif|*.svg|*.webp|*.woff|*.woff2|*.ttf|*.xml|robots.txt)
                mkdir -p "deploy/$(dirname "$file")"
                cp -- "$file" "deploy/$file"
                ;;
            esac
          done

          echo "Website files prepared:"
          find deploy -type f | wc -l

          for file in index.html portfolio.html style.css; do
            if [ ! -s "deploy/$file" ]; then
              echo "ERROR: $file is missing or empty. Deployment stopped."
              exit 1
            fi
          done

          echo "Website validation passed."

      - name: Deploy website to S3
        run: |
          aws s3 sync deploy/ "s3://${{ vars.S3_BUCKET }}/" \
            --exclude "*" \
            --include "*.html" \
            --include "*.css" \
            --include "*.js" \
            --include "*.json" \
            --include "*.ico" \
            --include "*.png" \
            --include "*.jpg" \
            --include "*.jpeg" \
            --include "*.gif" \
            --include "*.svg" \
            --include "*.webp" \
            --include "*.woff" \
            --include "*.woff2" \
            --include "*.ttf" \
            --include "*.xml" \
            --include "robots.txt"

      - name: Invalidate CloudFront cache
        run: |
          aws cloudfront create-invalidation \
            --distribution-id "${{ vars.CLOUDFRONT_DISTRIBUTION_ID }}" \
            --paths "/*"
